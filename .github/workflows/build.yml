name: Build SSPI source
on:
  workflow_dispatch:
    inputs:
      catalog_file:
        description: Input catalog JSON path
        required: true
        default: catalog/example.json
      output_name:
        description: Output filename under dist/
        required: true
        default: personal-library.gssource
  push:
    paths:
      - 'catalog/**'
      - 'tools/**'
      - 'docs/**'
      - 'README.md'
      - 'SSPI-Static-Catalog-Builder.zip'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test local password helper
        run: |
          python -m py_compile tools/password_lookup.py
          python - <<'PY'
          import json, tempfile
          from pathlib import Path
          from tools.password_lookup import apply_passwords
          catalog = {"titles":[{"packages":[{"id":"pkg-1"}]}]}
          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / "passwords.json"
              path.write_text(json.dumps({"packagePasswords":{"pkg-1":["known-password"]}}))
              result = apply_passwords(catalog, path)
              assert result["titles"][0]["packages"][0]["archivePasswords"] == ["known-password"]
          print("Password helper test passed")
          PY
      - name: Extract builder
        run: unzip -q SSPI-Static-Catalog-Builder.zip -d .
      - name: Build source
        run: |
          mkdir -p dist
          INPUT="${{ inputs.catalog_file || 'catalog/example.json' }}"
          OUTPUT="${{ inputs.output_name || 'personal-library.gssource' }}"
          python SSPI-Static-Catalog/tools/build_source.py "$INPUT" "dist/$OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sspi-gssource
          path: dist/*.gssource
